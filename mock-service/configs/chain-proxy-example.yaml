service:
  name: "user-service"
  version: "v1.0.0"
  port: 8080

behaviors:
  cpu:
    enabled: false
  memory:
    enabled: false
  startup:
    fail: false
  crash:
    enabled: false

endpoints:
  - path: "/health"
    method: "GET"
    response:
      status: 200
      body:
        status: "healthy"

  - path: "/api/v1/users/:id"
    method: "GET"
    response:
      status: 200
      body:
        id: "{{.PathParam.id}}"
        name: "User {{.PathParam.id}}"

  - path: "/api/v1/users/:id/orders"
    method: "GET"
    proxy:
      target: "http://order-service:8081"
      path: "/api/v1/orders"
      preserve_headers: true
      timeout: 5s
      query_params:
        user_id: "{{.PathParam.id}}"

observability:
  health_check:
    enabled: true
    port: 8080
    path: "/health"
  logging:
    level: "info"
    format: "json"
    output: "stdout"

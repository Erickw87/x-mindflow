service:
  name: "user-service"
  version: "v1.2.0"
  port: 8082

behaviors:
  cpu:
    enabled: true
    target_percent: 80
    trigger:
      type: "startup"
    duration: 600s
  memory:
    enabled: false
  startup:
    fail: false
    delay: 2s
  crash:
    enabled: false

endpoints:
  - path: "/health"
    method: "GET"
    response:
      status: 200
      body:
        status: "healthy"
        version: "v1.2.0"
    latency: 10ms

  - path: "/api/v1/users/:id"
    method: "GET"
    response:
      status: 200
      body:
        id: "{{.PathParam.id}}"
        name: "User {{.PathParam.id}}"
        email: "user{{.PathParam.id}}@example.com"
        version: "{{.Service.Version}}"
        created_at: "{{.Timestamp}}"
    latency: 50ms

  - path: "/api/v1/heavy-compute"
    method: "GET"
    response:
      status: 200
      body:
        message: "Heavy computation triggered"
    latency: 100ms

observability:
  health_check:
    enabled: true
    port: 8082
    path: "/health"
  logging:
    level: "info"
    format: "json"
    output: "stdout"
